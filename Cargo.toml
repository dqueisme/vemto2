[package]
name = "vemto-rust"
version = "0.1.0"
edition = "2021"
authors = ["Tiago Rodrigues <contact@vemto.app>", "Vemto Contributors"]
description = "Vemto - Fast, lightweight native Rust desktop application for Laravel code generation"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
heck = "0.5"
rfd = "0.15"

[lib]
name = "vemto_core"
path = "src/lib.rs"

[[bin]]
name = "vemto"
path = "src/main.rs"
